version: 2

models:
  - name: dim_date
    description: >
      Calendar dimension with one row per day, covering the full date range of
      stg_daily_consumer_ads_cpm. Weeks start on Monday (ISO weeks).
    columns:
      - name: date
        description: "Calendar date (primary key)."
        data_tests:
          - unique
          - not_null
      - name: year
        description: "Calendar year."
      - name: quarter
        description: "Calendar quarter (1-4)."
      - name: month
        description: "Calendar month number (1-12)."
      - name: month_name
        description: "Full month name, e.g. 'August'."
      - name: month_start_date
        description: "First day of the month."
      - name: iso_week
        description: "ISO week number (1-53)."
      - name: week_start_date
        description: "Monday of the ISO week."
      - name: day_of_week
        description: "Day of week, 1 = Monday through 7 = Sunday."
      - name: day_name
        description: "Full day name, e.g. 'Monday'."
      - name: is_weekend
        description: "True for Saturday and Sunday."
